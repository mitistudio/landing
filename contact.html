      <p style="font-size:15px; line-height:1.6; margin:0; color:color-mix(in srgb, var(--color-text) 82%, transparent);"><span id="t-studioLine1"></span><br><span id="t-studioLine2"></span></p>
    </div>
    <div>

      <p style="font-size:15px; line-height:1.6; margin:0;"><a href="mailto:hello@miti.studio">hello@miti.studio</a></p>

<script>
var STR = {
  en: {
    kicker: 'Contact', h1: 'Tell us about your project',
    sub: 'A couple of lines is plenty to start. We read every message ourselves and answer within two working days.',
    thanksTitle: 'Thanks, got it.', thanksBody: 'We\u2019ll reply within two working days.',
    labelName: 'Name', phName: 'Your name', labelEmail: 'Email', labelProject: 'What are you looking for?',
    labelMessage: 'Message', phMessage: 'A few lines about what you\u2019re building and when you\u2019d like to start.', send: 'Send message',
    studioHeading: 'Studio', studioLine1: 'MiTi Studio', studioLine2: 'Baden-Württemberg, Germany',
    emailHeading: 'Email', elsewhereHeading: 'Elsewhere', etsyLabel: 'Etsy shop',
    privacyNotePre: 'We use your details to answer your inquiry and nothing else. See ', privacyNoteLink: 'how we handle your data', privacyNotePost: '.',
    footerLine: '© 2026 MiTi Studio · Baden-Württemberg, Germany',
    legalImprint: 'Impressum', legalPrivacy: 'Privacy',
    projectOptions: ['Brand identity', 'Design system', 'UX/UI product design', 'Custom illustration', 'Custom font design', 'Not sure yet'],
  },
  de: {
    kicker: 'Kontakt', h1: 'Erzählen Sie uns von Ihrem Projekt',
    sub: 'Ein paar Zeilen reichen zum Start. Wir lesen jede Nachricht selbst und antworten innerhalb von zwei Werktagen.',
    thanksTitle: 'Danke, angekommen.', thanksBody: 'Wir antworten innerhalb von zwei Werktagen.',
    labelName: 'Name', phName: 'Ihr Name', labelEmail: 'E-Mail', labelProject: 'Wonach suchen Sie?',
    labelMessage: 'Nachricht', phMessage: 'Ein paar Zeilen darüber, was Sie bauen und wann Sie starten möchten.', send: 'Nachricht senden',
    studioHeading: 'Studio', studioLine1: 'MiTi Studio', studioLine2: 'Baden-Württemberg, Deutschland',
    emailHeading: 'E-Mail', elsewhereHeading: 'Anderswo', etsyLabel: 'Etsy-Shop',
    privacyNotePre: 'Wir nutzen Ihre Angaben nur, um Ihre Anfrage zu beantworten. Mehr dazu: ', privacyNoteLink: 'Umgang mit Ihren Daten', privacyNotePost: '.',
    footerLine: '© 2026 MiTi Studio · Baden-Württemberg, Deutschland',
    legalImprint: 'Impressum', legalPrivacy: 'Datenschutz',
    projectOptions: ['Markenidentität', 'Design-System', 'UX/UI-Produktdesign', 'Individuelle Illustration', 'Individuelles Schriftdesign', 'Noch unsicher'],
  },
};
function renderPage(lang) {
  var t = STR[lang];
  document.getElementById('t-kicker').textContent = t.kicker;
  document.getElementById('t-h1').textContent = t.h1;
  document.getElementById('t-sub').textContent = t.sub;
  document.getElementById('t-thanksTitle').textContent = t.thanksTitle;
  document.getElementById('t-thanksBody').textContent = t.thanksBody;
  document.getElementById('t-labelName').textContent = t.labelName;
  document.getElementById('c-name').placeholder = t.phName;
  document.getElementById('t-labelEmail').textContent = t.labelEmail;
  document.getElementById('t-labelProject').textContent = t.labelProject;
  document.getElementById('t-labelMessage').textContent = t.labelMessage;
  document.getElementById('c-message').placeholder = t.phMessage;
  document.getElementById('t-send').textContent = t.send;
  document.getElementById('t-privacyNotePre').textContent = t.privacyNotePre;
  document.getElementById('t-privacyNoteLink').textContent = t.privacyNoteLink;
  document.getElementById('t-privacyNotePost').textContent = t.privacyNotePost;
  document.getElementById('t-studioHeading').textContent = t.studioHeading;
  document.getElementById('t-studioLine1').textContent = t.studioLine1;
  document.getElementById('t-studioLine2').textContent = t.studioLine2;
  document.getElementById('t-emailHeading').textContent = t.emailHeading;
  document.getElementById('t-elsewhereHeading').textContent = t.elsewhereHeading;
  document.getElementById('t-etsyLabel').textContent = t.etsyLabel;
  document.getElementById('t-legalImprint').textContent = t.legalImprint;
  document.getElementById('t-legalPrivacy').textContent = t.legalPrivacy;
  document.getElementById('t-footerLine').textContent = t.footerLine;
  var sel = document.getElementById('c-project');
  sel.innerHTML = t.projectOptions.map(function (o) { return '<option>' + o + '</option>'; }).join('');
}
document.getElementById('contact-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var fd = new FormData(e.target);
  var params = new URLSearchParams();
  params.append('entry.1016249654', fd.get('name') || '');
  params.append('entry.1521365056', fd.get('email') || '');
  params.append('entry.603617520', fd.get('project') || '');
  params.append('entry.1877724977', fd.get('message') || '');
  fetch('https://docs.google.com/forms/d/e/1FAIpQLScKGfxIEDB4alFKEvU7vlR7EfFiBCPegncHjPE2yifX8klxug/formResponse', {
    method: 'POST', mode: 'no-cors', body: params,
  }).catch(function () {});
  document.getElementById('contact-form').style.display = 'none';
  document.getElementById('thanks-box').style.display = 'flex';
});
window.__mitiCurrentPage = 'contact';
miti.initNav('contact');
miti.initCookieConsent();
miti.initLangToggle(renderPage);
renderPage(miti.getLang());
</script>
